project_id = "brainswap"
[api]
enabled = true
schemas = ["public", "storage", "graphql_public"]
[db]
major_version = 15
[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
enable_signup = true
enable_anonymous_sign_ins = false
[auth.email]
# BrainSwap initiates Google OAuth only. Keep direct email/password or magic-link
# account creation disabled while still allowing new Google identities locally.
enable_signup = false
enable_confirmations = true
[storage]
enabled = true
[storage.buckets.job-files]
public = false
file_size_limit = "25MiB"
allowed_mime_types = ["application/pdf","text/plain","text/markdown","text/csv","application/json","image/png","image/jpeg","image/webp","application/vnd.openxmlformats-officedocument.wordprocessingml.document","application/vnd.openxmlformats-officedocument.presentationml.presentation","application/vnd.openxmlformats-officedocument.spreadsheetml.sheet","application/zip","application/x-zip-compressed"]

[storage.buckets.profile-photos]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/png","image/jpeg","image/webp"]
