project_id = "brainswap"
[api]
enabled = true
schemas = ["public", "storage", "graphql_public"]
[db]
major_version = 15
[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
[storage]
enabled = true
[storage.buckets.job-files]
public = false
file_size_limit = "25MiB"
allowed_mime_types = ["application/pdf","text/plain","text/markdown","text/csv","application/json","image/png","image/jpeg","image/webp","application/vnd.openxmlformats-officedocument.wordprocessingml.document","application/vnd.openxmlformats-officedocument.presentationml.presentation","application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"]
